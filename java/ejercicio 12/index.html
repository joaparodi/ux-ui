
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Posicionamiento y Tooltip</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="content-container">
        <h1>Monitoreo de Redes</h1>
        <p>Desplázate hacia abajo para probar el comportamiento del botón fijo en la pantalla.</p>

        <!-- Elemento padre con Tooltip -->
        <div class="tooltip-container">
            <button type="button" class="info-btn">Estado del Servidor</button>
            <span class="tooltip-text">Servidor activo - Latencia: 12ms</span>
        </div>

        <div class="spacer">
            <p>Contenido extenso para permitir el desplazamiento vertical (scroll)...</p>
        </div>
    </main>

    <!-- Botón Volver Arriba -->
    <a href="#" class="back-to-top" aria-label="Volver arriba">↑</a>

</body>

</html>
