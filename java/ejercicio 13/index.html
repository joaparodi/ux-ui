<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Formulario Estilizado</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="form-container">
        <h2>Reportar Incidente de Seguridad</h2>

        <form action="#" method="POST" class="styled-form">
            <div class="form-group">
                <label for="nombre">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. admin_red" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="usuario@seguridad.com" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Descripción del reporte</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Detalle la falla o evento..."
                    required></textarea>
            </div>

            <button type="submit" class="submit-btn">Enviar Reporte</button>
        </form>
    </main>

</body>

</html>
