<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Estructura Básica</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Ciberseguridad</h1>
    </header>

    <main>
        <p>La ciberseguridad es la práctica de proteger los equipos, las redes y la información contra ataques digitales
            y robos.
            Su meta es mantener los datos seguros y evitar accesos no autorizados.</p>

        <!-- Imagen en formato SVG vectorial directo -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
            <!-- Fondo con bordes redondeados -->
            <rect width="100%" height="100%" rx="15" fill="#0f172a" />

            <!-- Circuito / Red de fondo -->
            <path d="M 50 150 L 150 150 L 200 100" stroke="#1e293b" stroke-width="4" fill="none" />
            <path d="M 450 150 L 350 150 L 300 200" stroke="#1e293b" stroke-width="4" fill="none" />
            <circle cx="50" cy="150" r="6" fill="#0284c7" />
            <circle cx="450" cy="150" r="6" fill="#0284c7" />

            <!-- Escudo Exterior -->
            <path d="M 250 50 L 330 90 V 170 C 330 220 250 250 250 250 C 250 250 170 220 170 170 V 90 Z" fill="#0284c7"
                opacity="0.2" />
            <path d="M 250 60 L 320 95 V 165 C 320 210 250 238 250 238 C 250 238 180 210 180 165 V 95 Z" fill="none"
                stroke="#38bdf8" stroke-width="4" />

            <!-- Arco del Candado -->
            <path d="M 225 145 V 125 C 225 110 235 100 250 100 C 265 100 275 110 275 125 V 145" fill="none"
                stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />

            <!-- Cuerpo del Candado -->
            <rect x="215" y="145" width="70" height="55" rx="8" fill="#38bdf8" />

            <!-- Cerradura del Candado -->
            <circle cx="250" cy="167" r="5" fill="#0f172a" />
            <path d="M 250 172 V 183" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
        </svg>
    </main>

</body>

</html>
